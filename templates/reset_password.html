<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova password - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#12286a">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,700;1,700&display=swap">
</head>
<body>
    <header>
        <h1>Symposium</h1>
    </header>
    <main>
        {% with messaggi = get_flashed_messages() %}
            {% for m in messaggi %}<p class="flash">{{ m }}</p>{% endfor %}
        {% endwith %}
        <form class="form-tavolo" method="POST" action="{{ url_for('reset_password_pagina', token=token) }}">
            <h2>Scegli la nuova password</h2>
            <label for="nuova">Nuova password (min. 6 caratteri)</label>
            <input type="password" id="nuova" name="nuova" minlength="6" required>
            <label for="conferma">Ripeti la password</label>
            <input type="password" id="conferma" name="conferma" minlength="6" required>
            <button type="submit" class="btn-nuovo">Salva la password</button>
        </form>
    </main>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }</script>
</body>
</html>
