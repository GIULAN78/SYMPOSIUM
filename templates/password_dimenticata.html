<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password dimenticata - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#12286a">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,700;1,700&display=swap">
</head>
<body>
    <header>
        <h1>Symposium</h1>
        <a class="btn-indietro" href="{{ url_for('accedi') }}">← Torna all'accesso</a>
    </header>
    <main>
        {% with messaggi = get_flashed_messages() %}
            {% for m in messaggi %}<p class="flash">{{ m }}</p>{% endfor %}
        {% endwith %}
        <form class="form-tavolo" method="POST" action="{{ url_for('password_dimenticata') }}">
            <h2>Password dimenticata</h2>
            <p>Scrivi l'email con cui ti sei registrato: ti mandiamo un link per scegliere una nuova password.</p>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <button type="submit" class="btn-nuovo">Invia il link</button>
        </form>
    </main>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }</script>
</body>
</html>
