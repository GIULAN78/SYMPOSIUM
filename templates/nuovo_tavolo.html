<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea un tavolo - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Symposium</h1>
        <a class="btn-indietro" href="{{ url_for('home') }}">← Torna ai tavoli</a>
    </header>

    <main>
        <form class="form-tavolo" method="POST" action="{{ url_for('nuovo_tavolo') }}">
            <label for="tema">Tema del tavolo</label>
            <input type="text" id="tema" name="tema" placeholder="Es. Cena tra appassionati di storia" required>

            <label for="locale">Locale</label>
            <input type="text" id="locale" name="locale" placeholder="Nome del ristorante o locale" required>

            <label for="citta">Città</label>
            <input type="text" id="citta" name="citta" placeholder="Es. Novara" required>

            <label for="data_ora">Data e ora</label>
            <input type="datetime-local" id="data_ora" name="data_ora" required>

            <label for="posti_totali">Posti disponibili</label>
            <input type="number" id="posti_totali" name="posti_totali" min="2" max="20" value="6">

            <label for="obiettivo">Obiettivo (opzionale)</label>
            <input type="text" id="obiettivo" name="obiettivo" placeholder="Es. Niente smartphone al tavolo">

            <button type="submit" class="btn-nuovo">Crea tavolo</button>
        </form>
    </main>
</body>
</html>
