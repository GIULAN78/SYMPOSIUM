<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea un tavolo - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0b1437">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
    <header>
        <h1>Symposium</h1>
        <a class="btn-indietro" href="{{ url_for('home') }}">← Torna ai tavoli</a>
    </header>

    <main>
        {% with messaggi = get_flashed_messages() %}
            {% for m in messaggi %}<p class="flash">{{ m }}</p>{% endfor %}
        {% endwith %}
        <form class="form-tavolo" method="POST" action="{{ url_for('nuovo_tavolo') }}">
            <label for="tema">Tema del tavolo</label>
            <input type="text" id="tema" name="tema" placeholder="Es. Cena tra appassionati di storia" required>

            <label for="descrizione">Descrizione (opzionale)</label>
            <textarea id="descrizione" name="descrizione" rows="4" placeholder="Di cosa si parlerà, che tipo di serata, chi cerchi al tavolo..."></textarea>

            <label for="locale">Locale</label>
            <input type="text" id="locale" name="locale" placeholder="Nome del ristorante o locale" required>

            <label for="citta">Città</label>
            <input type="text" id="citta" name="citta" placeholder="Es. Novara" required>

            <label for="data_ora">Data e ora</label>
            <input type="datetime-local" id="data_ora" name="data_ora" required>

            <label for="min_partecipanti">Minimo partecipanti per confermare il tavolo</label>
            <input type="number" id="min_partecipanti" name="min_partecipanti" min="2" max="20" value="4">

            <label for="posti_totali">Massimo partecipanti</label>
            <input type="number" id="posti_totali" name="posti_totali" min="2" max="20" value="8">

            <label for="eta_min">Età minima</label>
            <input type="number" id="eta_min" name="eta_min" min="18" max="99" value="18">

            <label for="eta_max">Età massima</label>
            <input type="number" id="eta_max" name="eta_max" min="18" max="99" value="65">

            <label for="obiettivo">Obiettivo (opzionale)</label>
            <input type="text" id="obiettivo" name="obiettivo" placeholder="Es. Niente smartphone al tavolo">

            <button type="submit" class="btn-nuovo">Crea tavolo</button>
        </form>
    </main>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }</script>
</body>
</html>
