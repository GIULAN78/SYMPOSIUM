<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea un banchetto - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d2a78">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,700;1,700&display=swap">
</head>
<body>
    <header>
        <h1><a class="logo-link" href="{{ url_for('home') }}">Symposium</a></h1>
        
    </header>

    <main>
        {% with messaggi = get_flashed_messages() %}
            {% for m in messaggi %}<p class="flash">{{ m }}</p>{% endfor %}
        {% endwith %}
        <form class="form-tavolo" method="POST" action="{{ url_for('nuovo_tavolo') }}" enctype="multipart/form-data">
            <label for="tema">Tema del banchetto</label>
            <input type="text" id="tema" name="tema" placeholder="Es. Cena tra appassionati di storia" required>
            <label for="tipologia">Tipologia del banchetto *</label>
            <select id="tipologia" name="tipologia" required>
                <option value="">Scegli la tipologia...</option>
                {% for gruppo, elenco in GRUPPI_TIPOLOGIE %}
                <optgroup label="{{ gruppo }}">
                    {% for t in elenco %}<option value="{{ t.slug }}" data-dei="{{ 1 if t.esclusiva else 0 }}" data-descr="{{ t.descrizione }}">{{ t.emoji }} {{ t.nome }}</option>{% endfor %}
                </optgroup>
                {% endfor %}
            </select>
            <p class="nota" id="descr-tipologia"></p>

            <label for="foto">Foto del locale o del piatto (opzionale)</label>
            <input type="file" id="foto" name="foto" accept="image/*">

            <label for="descrizione">Descrizione (opzionale)</label>
            <textarea id="descrizione" name="descrizione" rows="4" placeholder="Di cosa si parlerà, che tipo di serata, chi cerchi al banchetto..."></textarea>

            <label for="locale">Locale</label>
            <input type="text" id="locale" name="locale" value="{{ request.args.get('locale', '') }}" placeholder="Nome del ristorante o locale" required>
            <input type="hidden" name="lat" value="{{ request.args.get('lat', '') }}">
            <input type="hidden" name="lng" value="{{ request.args.get('lng', '') }}">
            <input type="hidden" name="cerchio_id" value="{{ request.args.get('cerchio', '') }}">
            <a class="link-dettaglio" href="/locali">🔎 Cerca nei locali d'Italia</a>

            <label for="citta">Città</label>
            <input type="text" id="citta" name="citta" value="{{ request.args.get('citta', '') }}" placeholder="Es. Novara" required>

            <label for="data_ora">Data e ora</label>
            <input type="datetime-local" id="data_ora" name="data_ora" required>

            <label for="min_partecipanti">Minimo partecipanti per confermare il banchetto</label>
            <input type="number" id="min_partecipanti" name="min_partecipanti" min="2" max="20" value="4">

            <label for="posti_totali">Massimo partecipanti</label>
            <input type="number" id="posti_totali" name="posti_totali" min="2" max="20" value="8">

            <label for="eta_min">Età minima</label>
            <input type="number" id="eta_min" name="eta_min" min="18" max="99" value="18">

            <label for="eta_max">Età massima</label>
            <input type="number" id="eta_max" name="eta_max" min="18" max="99" value="65">

            <label for="obiettivo">Obiettivo (opzionale)</label>
            <input type="text" id="obiettivo" name="obiettivo" placeholder="Es. Niente smartphone al banchetto">
            <label for="spesa_indicativa">Spesa indicativa a persona in € (facoltativa)</label>
            <input type="number" id="spesa_indicativa" name="spesa_indicativa" min="1" max="500" placeholder="Es. 25">
            <label for="dopo_cena">Dopo il banchetto: dove si continua? (facoltativo)</label>
            <input type="text" id="dopo_cena" name="dopo_cena" maxlength="120" placeholder="Es. Un bar qui vicino">

            {% if sono_premium %}
            <label class="riga-check"><input type="checkbox" name="esclusivo" value="1"> ⭐ Banchetto degli dei (riservato ai Premium) {% if pag_attivo %}· costa {{ prezzo_dei }} ALX{% else %}· gratis per ora{% endif %}</label>
            {% endif %}
            <label class="riga-check"><input type="checkbox" name="su_richiesta" value="1"> 🔒 Su richiesta (approvo io chi partecipa)</label>
            <label for="raggio_km">Distanza massima dal locale</label>
            <select id="raggio_km" name="raggio_km">
                <option value="">Nessun limite</option>
                <option value="10">Entro 10 km</option>
                <option value="30">Entro 30 km</option>
                <option value="50">Entro 50 km</option>
                <option value="100">Entro 100 km</option>
            </select>
            <label class="riga-check"><input type="checkbox" name="gusto_limite" value="1"> 🎯 Solo per chi condivide almeno un interesse con la tipologia</label>
            <button type="submit" class="btn-nuovo">Crea banchetto</button>
        </form>
    </main>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }</script>
<script src="/static/js/citta.js" defer></script>
<script>
(function () {
    var s = document.getElementById("tipologia");
    if (!s) { return; }
    var d = document.getElementById("descr-tipologia");
    var chk = document.querySelector('input[name="esclusivo"]');
    s.addEventListener("change", function () {
        var o = s.options[s.selectedIndex];
        d.textContent = o.getAttribute("data-descr") || "";
        if (chk && o.getAttribute("data-dei") === "1") { chk.checked = true; }
    });
})();
</script>
<script>
(function () {
    var p = new URLSearchParams(window.location.search);
    function imposta(id, chiave) {
        var v = p.get(chiave), e = document.getElementById(id);
        if (v && e) { e.value = v; }
    }
    imposta("tema", "tema");
    imposta("posti_totali", "posti");
    imposta("eta_min", "eta_min");
    imposta("eta_max", "eta_max");
    var t = p.get("tipologia"), s = document.getElementById("tipologia");
    if (t && s) { s.value = t; s.dispatchEvent(new Event("change")); }
})();
</script>
</body>
</html>
