<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promemoria - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0d2a78">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,700;1,700&display=swap">
</head>
<body>
    <header>
        <h1><a class="logo-link" href="{{ url_for('home') }}">Symposium</a></h1>
        
    </header>
    <main>
        {% with messaggi = get_flashed_messages() %}{% for m in messaggi %}<p class="flash">{{ m }}</p>{% endfor %}{% endwith %}
        <h3 class="titolo-sezione">🔔 Promemoria</h3>
        <form class="form-tavolo" method="POST" action="{{ url_for('promemoria_pref') }}">
            <label class="riga-check"><input type="checkbox" name="promemoria" value="1" {% if p.promemoria %}checked{% endif %}> Promemoria dei banchetti a cui partecipo (24 ore e 2 ore prima) e dei posti riservati del cerchio</label>
            <label class="riga-check"><input type="checkbox" name="ci_manchi" value="1" {% if p.ci_manchi %}checked{% endif %}> «Ci manchi» se non passo per 10 giorni</label>
            <label class="riga-check"><input type="checkbox" name="zona" value="1" {% if p.zona %}checked{% endif %}> Riepilogo giornaliero dei nuovi banchetti nella mia città</label>
            <label for="silenzio_da">Ore di silenzio: non disturbarmi dalle</label>
            <select id="silenzio_da" name="silenzio_da">
                {% for h in range(24) %}<option value="{{ h }}" {% if h == p.silenzio_da %}selected{% endif %}>{{ '%02d'|format(h) }}:00</option>{% endfor %}
            </select>
            <label for="silenzio_a">alle</label>
            <select id="silenzio_a" name="silenzio_a">
                {% for h in range(24) %}<option value="{{ h }}" {% if h == p.silenzio_a %}selected{% endif %}>{{ '%02d'|format(h) }}:00</option>{% endfor %}
            </select>
            <button type="submit" class="btn-nuovo">Salva</button>
        </form>
        <h3 class="titolo-sezione">📱 Notifiche sul telefono</h3>
        <p class="nota">Ricevi gli avvisi anche con l'app chiusa. Sull'iPhone funzionano solo se aggiungi Symposium alla schermata Home. Rispettano le ore di silenzio.</p>
        <button type="button" class="btn-nuovo" id="push-attiva">Attiva le notifiche</button>
        <button type="button" class="btn-piccolo" id="push-prova">Invia una notifica di prova</button>
        <p class="nota" id="push-esito"></p>
        <script>
        (function () {
          var esito = document.getElementById("push-esito");
          function msg(t) { esito.textContent = t; }
          function chiaveBytes(b64) {
            var pad = "=".repeat((4 - b64.length % 4) % 4);
            var raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
            var out = new Uint8Array(raw.length);
            for (var i = 0; i < raw.length; i++) { out[i] = raw.charCodeAt(i); }
            return out;
          }
          document.getElementById("push-attiva").onclick = async function () {
            try {
              if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
                msg("Questo dispositivo non supporta le notifiche push (su iPhone aggiungi prima Symposium alla schermata Home).");
                return;
              }
              var perm = await Notification.requestPermission();
              if (perm !== "granted") { msg("Permesso negato: abilita le notifiche per questo sito dalle impostazioni del browser."); return; }
              var reg = await navigator.serviceWorker.ready;
              var r = await fetch("/push/chiave");
              var k = (await r.json()).chiave;
              var sub = await reg.pushManager.getSubscription();
              if (!sub) { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chiaveBytes(k) }); }
              var s = await fetch("/push/iscrivi", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
              msg(s.ok ? "Notifiche attivate su questo dispositivo." : "Non sono riuscito ad attivarle: riprova.");
            } catch (e) { msg("Errore: " + e.message); }
          };
          document.getElementById("push-prova").onclick = async function () {
            var r = await fetch("/push/prova", { method: "POST" });
            msg(r.ok ? "Notifica di prova inviata: se non arriva entro qualche secondo, attiva prima le notifiche." : "Accedi per provare.");
          };
        })();
        </script>
    </main>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/sw.js"); }</script>
</body>
</html>
