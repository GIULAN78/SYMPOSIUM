<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - Symposium</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Symposium</h1>
        <a class="btn-indietro" href="{{ url_for('home') }}">← Torna ai tavoli</a>
    </header>
    <main>
        {% with messaggi = get_flashed_messages() %}
            {% for m in messaggi %}<p class="flash">{{ m }}</p>{% endfor %}
        {% endwith %}
        <form class="form-tavolo" method="POST" action="{{ url_for('accedi') }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="btn-nuovo">Accedi</button>
            <p class="link-alt">Non hai un account? <a href="{{ url_for('registrati') }}">Registrati</a></p>
        </form>
    </main>
</body>
</html>
